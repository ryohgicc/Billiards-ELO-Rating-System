<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">月度隐藏分定级赛积分算法流程图</title>
  <desc id="desc">展示近三个月最终分如何生成月初隐藏分，前五场定级赛如何校准，第六场起如何进入正式赛，以及月末最终分如何成为后续隐藏分样本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10110d"/>
      <stop offset="0.52" stop-color="#19180f"/>
      <stop offset="1" stop-color="#080907"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .h1 { font: 800 68px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff6cf; }
      .sub { font: 500 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #cfc6a2; }
      .step { font: 800 34px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #151307; }
      .body { font: 600 25px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f6eed0; }
      .muted { font: 500 22px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #c9c0a1; }
      .formula { font: 800 24px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #141207; }
      .small { font: 700 19px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #141207; }
      .chipText { font: 800 22px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #141207; }
      .panel { fill: #202019; stroke: #48432d; stroke-width: 2; }
      .gold { fill: #ffcf2e; }
      .cream { fill: #fff1b0; }
      .line { stroke: #ffcf2e; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke: #5d5635; stroke-width: 2; fill: none; }
      .outline { fill: rgba(255,207,46,0.08); stroke: #ffcf2e; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>
  <circle cx="1640" cy="130" r="54" fill="#fff4c0"/>
  <circle cx="1640" cy="130" r="39" fill="#13120a"/>
  <text x="1626" y="144" class="h1" font-size="44">8</text>
  <path d="M116 184 H1684" class="thin"/>

  <g transform="translate(110 74)">
    <text class="h1" x="0" y="0" dominant-baseline="hanging">月度积分新算法</text>
    <text class="sub" x="4" y="90">用近 3 个月最终分做隐藏分锚点，前 5 场定级，第 6 场起正式冲榜</text>
  </g>

  <g transform="translate(110 240)" filter="url(#shadow)">
    <rect class="panel" width="430" height="285" rx="20"/>
    <rect class="gold" x="28" y="28" width="194" height="58" rx="14"/>
    <text class="step" x="52" y="58" dominant-baseline="middle">1. 历史输入</text>
    <text class="body" x="42" y="126">取最近 3 个月</text>
    <text class="body" x="42" y="166">月末最终公开分</text>
    <g transform="translate(42 204)">
      <rect class="cream" width="96" height="48" rx="12"/>
      <text class="chipText" x="22" y="31">上月</text>
      <rect class="cream" x="116" width="96" height="48" rx="12"/>
      <text class="chipText" x="128" y="31">上上月</text>
      <rect class="cream" x="232" width="96" height="48" rx="12"/>
      <text class="chipText" x="244" y="31">上上上月</text>
    </g>
  </g>

  <g transform="translate(685 240)" filter="url(#shadow)">
    <rect class="panel" width="430" height="285" rx="20"/>
    <rect class="gold" x="28" y="28" width="230" height="58" rx="14"/>
    <text class="step" x="52" y="58" dominant-baseline="middle">2. 月初隐藏分</text>
    <text class="body" x="42" y="126">按近月权重加权</text>
    <text class="muted" x="42" y="166">历史不足时按已有月份归一化</text>
    <g transform="translate(42 206)">
      <rect class="cream" width="346" height="54" rx="12"/>
      <text class="formula" x="20" y="36">hiddenStart = 0.5A + 0.3B + 0.2C</text>
    </g>
  </g>

  <g transform="translate(1260 240)" filter="url(#shadow)">
    <rect class="panel" width="430" height="285" rx="20"/>
    <rect class="gold" x="28" y="28" width="214" height="58" rx="14"/>
    <text class="step" x="52" y="58" dominant-baseline="middle">3. 定级赛</text>
    <text class="body" x="42" y="126">每月前 5 场</text>
    <text class="body" x="42" y="166">标准 Elo，K_cal = 150</text>
    <text class="muted" x="42" y="206">不触发连胜奖励 / 动态扣分</text>
    <g transform="translate(42 232)">
      <circle class="gold" cx="22" cy="22" r="22"/><text class="small" x="9" y="29">1</text>
      <circle class="gold" cx="78" cy="22" r="22"/><text class="small" x="65" y="29">2</text>
      <circle class="gold" cx="134" cy="22" r="22"/><text class="small" x="121" y="29">3</text>
      <circle class="gold" cx="190" cy="22" r="22"/><text class="small" x="177" y="29">4</text>
      <circle class="gold" cx="246" cy="22" r="22"/><text class="small" x="233" y="29">5</text>
    </g>
  </g>

  <path class="line" d="M550 382 H675"/>
  <path class="line" d="M1115 382 H1250"/>
  <path class="line" d="M660 366 L678 382 L660 398"/>
  <path class="line" d="M1235 366 L1253 382 L1235 398"/>

  <g transform="translate(250 650)" filter="url(#shadow)">
    <rect class="panel" width="540" height="300" rx="20"/>
    <rect class="gold" x="28" y="28" width="288" height="58" rx="14"/>
    <text class="step" x="52" y="58" dominant-baseline="middle">4. 正式起始分</text>
    <text class="body" x="42" y="126">打满 5 场后生成本月起跑线</text>
    <g transform="translate(42 170)">
      <rect class="cream" width="440" height="70" rx="14"/>
      <text class="formula" x="22" y="44">formalStart = round(0.4×hiddenStart + 0.6×calibrated)</text>
    </g>
    <text class="muted" x="42" y="272">校准中球员显示临时分，不建议参与正式排名</text>
  </g>

  <g transform="translate(1010 650)" filter="url(#shadow)">
    <rect class="panel" width="540" height="300" rx="20"/>
    <rect class="gold" x="28" y="28" width="268" height="58" rx="14"/>
    <text class="step" x="52" y="58" dominant-baseline="middle">5. 正式赛冲榜</text>
    <text class="body" x="42" y="126">第 6 场起进入正式赛</text>
    <text class="body" x="42" y="166">固定 K_formal = 100</text>
    <text class="muted" x="42" y="206">保留胜方加分、败方动态扣分、连胜奖励</text>
    <g transform="translate(42 234)">
      <rect class="cream" width="360" height="46" rx="12"/>
      <text class="formula" x="20" y="31">月末最终分 = 下月隐藏分样本</text>
    </g>
  </g>

  <path class="line" d="M1475 530 C1475 590 1395 610 1280 630"/>
  <path class="line" d="M1289 610 L1264 632 L1296 642"/>
  <path class="line" d="M1010 800 H800"/>
  <path class="line" d="M815 784 L796 800 L815 816"/>

  <g transform="translate(115 1000)">
    <rect x="0" y="0" width="1570" height="62" rx="18" fill="#14140f" stroke="#4d472e" stroke-width="2"/>
    <text class="body" x="36" y="40">一句话：历史最终分决定本月隐藏分，5 场定分决定起跑线，正式赛决定本月最终公开分。</text>
  </g>
</svg>
